name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send PR data to ReleaseNotes.io
        run: |
          curl --request POST \
            --url https://api.releasenotes.io/api/v1/projects/11453/releases \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "external_id": "current-sprint",
              "version": "Next Upcoming Release",
              "title": "Unpublished Team Updates",
              "published": false,
              "body": "• GitHub PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})<br>",
              "release_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "type": "update"
            }'
