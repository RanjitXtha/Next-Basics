name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unique Weekly ID
        id: get_id
        run: echo "weekly_id=draft-$(date +'%Y-W%V')" >> $GITHUB_OUTPUT

      - name: Send PR data to ReleaseNotes.io
        run: |
          curl --request POST \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
            "external_id": "test-4",
            "version": "v1.1.0-test",
            "title": "GithubDraft",
            "published": false,
            "description": "<h4>new new</h4><ul><li>Successfully validated the API endpoint layout directly from Postman.</li></ul>",
            "type": "update"
            }'
