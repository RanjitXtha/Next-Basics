name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Append PR Data to ReleaseNotes.io
        run: |
          # 1. Fetch all existing releases
          RESPONSE=$(curl --silent --request GET \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json')

          # 2. Look for an existing draft with our external_id
          EXISTING_DESCRIPTION=$(echo "$RESPONSE" | jq -r '.data[] | select(.external_id == "current-sprint") | .description' || echo "")

          # 3. Create the new line text
          NEW_LINE="• GitHub PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})<br>"

          # 4. If nothing exists, start fresh. If it exists, append new data to the bottom.
          if [ -z "$EXISTING_DESCRIPTION" ] || [ "$EXISTING_DESCRIPTION" = "null" ]; then
            UPDATED_DESCRIPTION="$NEW_LINE"
          else
            UPDATED_DESCRIPTION="${EXISTING_DESCRIPTION}${NEW_LINE}"
          fi

          # 5. Build the final JSON package securely
          PAYLOAD=$(jq -n \
            --arg ext_id "current-sprint" \
            --arg title "Github merge" \
            --arg version "Next Upcoming Release" \
            --arg desc "$UPDATED_DESCRIPTION" \
            '{
              external_id: $ext_id,
              title: $title,
              version: $version,
              type: "feature",
              published: false,
              description: $desc
            }')

          # 6. POST the data back to ReleaseNotes.io
          curl --request POST \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD"
