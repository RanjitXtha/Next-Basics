name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Process and Append Release Note via Node.js
        uses: actions/github-script@v7
        env:
          RELEASENOTES_API_KEY: ${{ secrets.RELEASENOTES_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const crypto = require('crypto');
            
            // 1. Calculate the unique weekly ID (matching draft-YYYY-Www format)
            const today = new Date();
            const year = today.getFullYear();
            // Calculate simple ISO week number
            const target = new Date(today.valueOf());
            const dayNr = (today.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            const firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
              target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
            }
            const weekNum = 1 + Math.ceil((firstThursday - target) / 604800000);
            const paddedWeek = String(weekNum).padStart(2, '0');
            const weeklyId = `draft-${year}-W${paddedWeek}`;
            
            console.log(`Targeting unique week ID: ${weeklyId}`);

            // 2. Fetch existing releases from the endpoint
            const res = await fetch('https://api.releasenotes.io/api/v1/projects/11453/releases', {
              headers: { 'Authorization': `Bearer ${process.env.RELEASENOTES_API_KEY}` }
            });
            const payload = await res.json();
            
            // 3. Find if our weekly draft already exists in the collection
            const existingDraft = payload.data?.find(item => item.external_id === weeklyId);
            let combinedDesc = '';
            const newLine = `<li>GitHub PR: ${process.env.PR_TITLE} (#${process.env.PR_NUMBER})</li>`;

            if (!existingDraft || !existingDraft.description) {
              // Brand new draft template layout for the week
              combinedDesc = `<h4>new</h4>\n<ul>\n${newLine}\n</ul>`;
            } else {
              const currentDesc = existingDraft.description;
              // Safely find the closing </ul> tag regardless of white space or newlines
              if (currentDesc.includes('</ul>')) {
                combinedDesc = currentDesc.replace('</ul>', `${newLine}\n</ul>`);
              } else {
                combinedDesc = `${currentDesc}\n${newLine}`;
              }
            }

            // 4. Dispatch the compiled data block back to ReleaseNotes.io
            console.log("Sending updated description payload...");
            const postRes = await fetch('https://api.releasenotes.io/api/v1/projects/11453/releases', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.RELEASENOTES_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                external_id: weeklyId,
                version: "Next Upcoming Release",
                title: "GithubDraft",
                published: false,
                description: combinedDesc,
                type: "update"
              })
            });

            if (!postRes.ok) {
              throw new Error(`API Request failed with status code ${postRes.status}: ${await postRes.text()}`);
            }
            console.log("Successfully saved note to timeline!");
