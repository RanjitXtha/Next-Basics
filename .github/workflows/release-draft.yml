name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send PR data to ReleaseNotes.io
        run: |
          curl --request POST \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "external_id": "current-sprint",
              "title": "Github Merges",
              "type": "feature",
              "published": false,
              "description": "• GitHub PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})<br>"
            }'
