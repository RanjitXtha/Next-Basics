name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unique Weekly ID
        id: get_id
        run: echo "weekly_id=draft-$(date +'%Y-W%V')" >> $GITHUB_OUTPUT

      - name: Send PR data to ReleaseNotes.io
        run: |
          curl --request POST \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "external_id": "${{ steps.get_id.outputs.weekly_id }}",
              "version": "Next Upcoming Release",
              "title": "Github rleease",
              "published": false,
              "description": "• GitHub PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})<br>"
            }'
