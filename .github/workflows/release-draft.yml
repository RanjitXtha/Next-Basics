name: Sync GitHub Merge to ReleaseNotes Draft

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  append-to-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Append PR Data to ReleaseNotes.io
        run: |
          # 1. Fetch all releases from the API
          RESPONSE=$(curl --silent --request GET \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json')

          # 2. Extract the description of the existing draft matching our external_id
          # If no matching draft is found, initialize an empty string baseline
          EXISTING_DESCRIPTION=$(echo "$RESPONSE" | jq -r '.data[] | select(.external_id == "current-sprint") | .description' || echo "")

          # 3. Format the new PR text item as an HTML list element
          NEW_LINE="<li>GitHub PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})</li>"

          # 4. Handle structural text formatting
          if [ -z "$EXISTING_DESCRIPTION" ] || [ "$EXISTING_DESCRIPTION" = "null" ]; then
            # If starting a brand new draft, wrap the item inside an unordered HTML list
            UPDATED_DESCRIPTION="<h2>Merged Pull Requests:</h2><ul>${NEW_LINE}</ul>"
          else
            # If the draft exists, split the string at the closing list tag to cleanly insert the new item
            UPDATED_DESCRIPTION=$(echo "$EXISTING_DESCRIPTION" | sed "s|<\/ul>|${NEW_LINE}</ul>|")
          fi

          # 5. Push the compiled text data structure back to ReleaseNotes.io
          # Use jq to construct valid, injection-safe JSON payloads
          PAYLOAD=$(jq -n \
            --arg ext_id "current-sprint" \
            --arg title "Unpublished Team Updates" \
            --arg version "Next Upcoming Release" \
            --arg desc "$UPDATED_DESCRIPTION" \
            '{
              external_id: $ext_id,
              title: $title,
              version: $version,
              type: "feature",
              published: false,
              description: $desc
            }')

          curl --request POST \
            --url https://releasenotes.io \
            --header 'Authorization: Bearer ${{ secrets.RELEASENOTES_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD"
